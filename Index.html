<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>MilkFlow — Shop Distributor</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #ccfbf1;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --warn: #d97706;
      --warn-bg: #fef3c7;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
    }
    .app-shell {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--primary);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; }
    header .date-pill {
      font-size: 12px;
      background: rgba(255,255,255,0.18);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }
    .container { padding: 12px; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .col { flex: 1; }
    .muted { color: var(--muted); font-size: 13px; }
    .bold { font-weight: 700; }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .badge-ok { background: var(--success-bg); color: var(--success); }
    .badge-pend { background: var(--warn-bg); color: var(--warn); }
    .badge-red { background: var(--danger-bg); color: var(--danger); }
    .badge-teal { background: var(--primary-light); color: var(--primary-dark); }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 6px;
    }
    .chip {
      border: 1px solid var(--border);
      background: #fff;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
      color: var(--text);
    }
    input:focus, select:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-sm { padding: 8px 12px; font-size: 13px; border-radius: 8px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-wa { background: #16a34a; color: #fff; }
    .btn-outline { background: #fff; color: var(--text); border: 1px solid #cbd5e1; }
    .btn-danger { background: var(--danger-bg); color: var(--danger); }
    .btn-block { width: 100%; }

    .qty-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .qty-btn {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }
    .qty-input {
      width: 64px;
      text-align: center;
      padding: 7px 4px;
      font-weight: 700;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .stat-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .stat-val { font-size: 20px; font-weight: 800; margin-top: 4px; }

    /* Bottom Navigation */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 25;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      border: none;
      background: none;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }
    .nav-item.active { color: var(--primary); }
    .nav-icon { font-size: 20px; line-height: 1; }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 18px 18px 0 0;
      padding: 16px;
      animation: slideUp 0.18s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0.7; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .close-btn {
      border: none;
      background: #f1f5f9;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
    .item-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border);
    }
    .total-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="app-shell">
  <header>
    <div>
      <h1>MilkFlow</h1>
      <div style="font-size:11px; opacity:0.85;">Shop Distributor App</div>
    </div>
    <div class="date-pill" id="headerDate"></div>
  </header>

  <main class="container" id="mainView"></main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="deliver" onclick="switchTab('deliver')">
      <span class="nav-icon">🚚</span>
      <span>Deliver</span>
    </button>
    <button class="nav-item" data-tab="shops" onclick="switchTab('shops')">
      <span class="nav-icon">🏪</span>
      <span>Shops</span>
    </button>
    <button class="nav-item" data-tab="stock" onclick="switchTab('stock')">
      <span class="nav-icon">🥛</span>
      <span>Stock</span>
    </button>
    <button class="nav-item" data-tab="hisab" onclick="switchTab('hisab')">
      <span class="nav-icon">📊</span>
      <span>Hisab</span>
    </button>
  </nav>
</div>

<!-- Delivery Modal -->
<div class="modal-backdrop" id="deliveryModal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="bold" style="font-size:17px;" id="dmShopName">Shop Name</div>
        <div class="muted" id="dmShopMeta"></div>
      </div>
      <button class="close-btn" onclick="closeModal('deliveryModal')">✕</button>
    </div>

    <div id="dmItems"></div>

    <div class="row" style="margin-top:10px;">
      <div class="col">
        <label>Leakage / Return Deduct (₹)</label>
        <input type="number" id="dmLeakage" value="0" min="0" oninput="recalcDelivery()" />
      </div>
      <div class="col">
        <label>Crates Given</label>
        <input type="number" id="dmCratesGiven" value="0" min="0" />
      </div>
      <div class="col">
        <label>Empty Returned</label>
        <input type="number" id="dmCratesRet" value="0" min="0" />
      </div>
    </div>

    <div class="total-box">
      <div class="row"><span>Today's Bill</span><span class="bold" id="dmBillTotal">₹0</span></div>
      <div class="row" style="margin-top:4px;"><span class="muted">Previous Pending</span><span class="muted" id="dmPrevBal">₹0</span></div>
      <div class="row" style="margin-top:6px; padding-top:6px; border-top:1px solid var(--border);">
        <span class="bold">Total Payable</span><span class="bold" style="font-size:18px; color:var(--primary);" id="dmGrandDue">₹0</span>
      </div>
    </div>

    <div class="row" style="margin-top:8px;">
      <div class="col">
        <label>Paid Today (₹)</label>
        <input type="number" id="dmPaid" value="0" min="0" oninput="recalcDelivery()" />
      </div>
      <div class="col">
        <label>Payment Mode</label>
        <select id="dmPayMode">
          <option value="Cash">Cash</option>
          <option value="UPI">UPI</option>
        </select>
      </div>
    </div>
    <div class="row" style="margin-top:8px;">
      <button class="btn btn-sm btn-outline col" onclick="fillPaid('today')">Pay Today's Bill</button>
      <button class="btn btn-sm btn-outline col" onclick="fillPaid('zero')">Full Credit (₹0)</button>
    </div>
    <div class="muted" style="margin-top:8px; text-align:right;">
      New Pending Balance: <strong id="dmNewBal" style="color:var(--danger);">₹0</strong>
    </div>

    <div class="row" style="margin-top:14px;">
      <button class="btn btn-primary col" onclick="saveDelivery(false)">Save</button>
      <button class="btn btn-wa col" onclick="saveDelivery(true)">Save & WhatsApp</button>
    </div>
  </div>
</div>

<!-- Add/Edit Shop Modal -->
<div class="modal-backdrop" id="shopModal">
  <div class="modal">
    <div class="modal-header">
      <div class="bold" style="font-size:17px;" id="smTitle">Add Shop</div>
      <button class="close-btn" onclick="closeModal('shopModal')">✕</button>
    </div>
    <input type="hidden" id="smId" />
    <label>Shop Name *</label>
    <input type="text" id="smName" placeholder="e.g. Sharma Kirana" />
    <div class="row">
      <div class="col">
        <label>Route / Area</label>
        <input type="text" id="smRoute" placeholder="e.g. Market Road" />
      </div>
      <div class="col">
        <label>WhatsApp Phone</label>
        <input type="tel" id="smPhone" placeholder="10 digit number" />
      </div>
    </div>
    <div class="row">
      <div class="col">
        <label>Pending Balance (₹)</label>
        <input type="number" id="smBalance" value="0" />
      </div>
      <div class="col">
        <label>Pending Crates</label>
        <input type="number" id="smCrates" value="0" />
      </div>
    </div>
    <div style="margin-top:14px; font-weight:700; font-size:13px;">Usual Daily Order & Custom Rate</div>
    <div id="smUsualList"></div>
    <div class="row" style="margin-top:14px;">
      <button class="btn btn-primary btn-block" onclick="saveShop()">Save Shop</button>
    </div>
  </div>
</div>

<!-- Collect Payment / Crates Modal -->
<div class="modal-backdrop" id="payModal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="bold" style="font-size:17px;" id="pmShopName">Collect Payment</div>
        <div class="muted" id="pmCurrent"></div>
      </div>
      <button class="close-btn" onclick="closeModal('payModal')">✕</button>
    </div>
    <input type="hidden" id="pmShopId" />
    <label>Amount Received (₹)</label>
    <input type="number" id="pmAmount" value="0" min="0" />
    <label>Payment Mode</label>
    <select id="pmMode">
      <option value="Cash">Cash</option>
      <option value="UPI">UPI</option>
    </select>
    <label>Empty Crates Collected</label>
    <input type="number" id="pmCrates" value="0" min="0" />
    <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="saveStandalonePayment()">Save Collection</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'milkflow_dist_v1';

function getTodayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function uid() {
  return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
}

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function defaultState() {
  const p1 = 'p_fc', p2 = 'p_tm', p3 = 'p_curd';
  return {
    products: [
      { id: p1, name: 'Full Cream 500ml', rate: 33, perCrate: 24 },
      { id: p2, name: 'Toned Milk 500ml', rate: 27, perCrate: 24 },
      { id: p3, name: 'Curd 400g', rate: 35, perCrate: 12 }
    ],
    shops: [
      { id: 's1', name: 'Sharma Kirana', route: 'Route 1', phone: '', balance: 1250, crates: 2, usual: { [p1]: 24, [p2]: 24, [p3]: 6 }, customRates: {} },
      { id: 's2', name: 'Balaji Tea Stall', route: 'Route 1', phone: '', balance: 400, crates: 1, usual: { [p1]: 48, [p2]: 0, [p3]: 0 }, customRates: {} },
      { id: 's3', name: 'Ganesh Bakery', route: 'Route 2', phone: '', balance: 0, crates: 0, usual: { [p1]: 24, [p2]: 12, [p3]: 12 }, customRates: {} }
    ],
    morningLoad: { [p1]: 120, [p2]: 72, [p3]: 24 },
    deliveries: [],
    payments: []
  };
}

let state = loadState();
let currentTab = 'deliver';
let selectedRoute = 'ALL';
let shopSearch = '';
let activeDeliveryShopId = null;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return defaultState();
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    alert('Storage warning: could not save to browser storage.');
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  render();
}

function getRoutes() {
  const set = new Set(state.shops.map(s => (s.route || 'General').trim()));
  return ['ALL', ...Array.from(set)];
}

function getShopRate(shop, product) {
  const cr = shop.customRates && shop.customRates[product.id];
  return (cr !== undefined && cr !== '' && !isNaN(cr)) ? Number(cr) : Number(product.rate);
}

function render() {
  document.getElementById('headerDate').textContent = getTodayStr();
  const main = document.getElementById('mainView');
  if (currentTab === 'deliver') renderDeliver(main);
  else if (currentTab === 'shops') renderShops(main);
  else if (currentTab === 'stock') renderStock(main);
  else if (currentTab === 'hisab') renderHisab(main);
}

/* ---------------- TAB 1: DELIVER ---------------- */
function renderDeliver(el) {
  const today = getTodayStr();
  const todayDeliv = state.deliveries.filter(d => d.date === today);
  const deliveredShopIds = new Set(todayDeliv.map(d => d.shopId));
  const routes = getRoutes();

  const filtered = state.shops.filter(s => {
    if (selectedRoute !== 'ALL' && (s.route || 'General') !== selectedRoute) return false;
    return true;
  });

  const doneCount = state.shops.filter(s => deliveredShopIds.has(s.id)).length;

  let html = `
    <div class="card" style="background:var(--primary-light); border-color:#99f6e4;">
      <div class="row">
        <div>
          <div class="bold" style="color:var(--primary-dark);">Today's Progress</div>
          <div class="muted" style="color:#115e59;">${doneCount} of ${state.shops.length} shops delivered</div>
        </div>
        <button class="btn btn-sm btn-primary" onclick="openShopModal()">+ Add Shop</button>
      </div>
    </div>
    <div class="chips">
      ${routes.map(r => `<button class="chip ${selectedRoute === r ? 'active' : ''}" onclick="selectedRoute='${esc(r)}'; render();">${r === 'ALL' ? 'All Routes' : esc(r)}</button>`).join('')}
    </div>
  `;

  if (filtered.length === 0) {
    html += `<div class="card muted" style="text-align:center; padding:30px;">No shops in this route. Tap "+ Add Shop" to create one.</div>`;
  }

  filtered.forEach(shop => {
    const isDone = deliveredShopIds.has(shop.id);
    const usualSummary = state.products
      .map(p => (shop.usual && shop.usual[p.id]) ? `${p.name.split(' ')[0]}: ${shop.usual[p.id]}` : null)
      .filter(Boolean).join(' • ') || 'No usual order set';

    html += `
      <div class="card" onclick="openDeliveryModal('${esc(shop.id)}')" style="cursor:pointer;">
        <div class="row">
          <div class="col">
            <div class="bold" style="font-size:16px;">${esc(shop.name)}</div>
            <div class="muted">${esc(shop.route || 'General')} • ${esc(usualSummary)}</div>
          </div>
          <div style="text-align:right;">
            ${isDone ? '<span class="badge badge-ok">✓ Delivered</span>' : '<span class="badge badge-pend">Pending</span>'}
            <div style="margin-top:6px; font-size:13px;">
              Bal: <strong style="color:${shop.balance > 0 ? 'var(--danger)' : 'var(--success)'};">₹${shop.balance}</strong>
              ${shop.crates ? ` • <span class="badge badge-teal">${shop.crates} Crates</span>` : ''}
            </div>
          </div>
        </div>
      </div>
    `;
  });

  el.innerHTML = html;
}

/* ---------------- DELIVERY MODAL ---------------- */
function ope
